# TEMPLATE: Install a trusted certificate with SAN noir.cafe.test first.
# Copy into sites-available, enable its symlink, then run nginx -t.
server {
    listen 443 ssl;
    server_name noir.cafe.test;
    ssl_certificate /etc/noir/tls/noir.crt;
    ssl_certificate_key /etc/noir/tls/noir.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
